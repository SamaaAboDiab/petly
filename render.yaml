# Render blueprint for the API (Express + Socket.IO need a long-running server,
# so the backend lives here while the frontend is on Vercel).
services:
  - type: web
    name: petly-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      # The Vercel URL, e.g. https://petly.vercel.app (comma-separate several).
      - key: CLIENT_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
